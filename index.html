<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Calificaciones</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        h1 { text-align: center; color: #333; }
        label, button { display: block; margin-top: 10px; }
        input[type="number"] { padding: 8px; width: 100%; box-sizing: border-box; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background-color: #0056b3; }
        .materia-input { border: 1px solid #eee; padding: 15px; margin-top: 15px; border-radius: 4px; }
        .calificacion-input { display: flex; gap: 10px; margin-top: 5px; }
        .calificacion-input input { width: 24%; }
        .resultado-materia { margin-top: 10px; padding: 10px; border-left: 5px solid #007bff; background-color: #f9f9f9; }
        .aprobado { color: green; font-weight: bold; }
        .no-aprobado { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Calculadora de Calificaciones por Materia</h1>
        
        <label for="numMaterias">Número de Materias (N):</label>
        <input type="number" id="numMaterias" min="1" value="1">
        <button onclick="generarInputs()">Generar Materias</button>

        <hr>

        <div id="materiasContainer">
            </div>

        <button id="calcularBtn" onclick="calcularPromedios()" style="display: none; margin-top: 20px;">Calcular Promedios</button>

        <hr style="margin-top: 30px;">
        
        <h2>Resultados por Materia</h2>
        <div id="resultados">
            </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
